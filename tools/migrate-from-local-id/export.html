<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Newtabber data rescue</title>
    <style>
      body {
        margin: 0 auto;
        padding: 2rem 1.5rem;
        max-width: 44rem;
        font: 14px/1.5 system-ui, sans-serif;
        color-scheme: light dark;
      }
      h1 {
        font-size: 1.25rem;
      }
      #summary {
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        background: rgb(127 127 127 / 15%);
      }
      button {
        font: inherit;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      textarea {
        width: 100%;
        height: 14rem;
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Newtabber data rescue</h1>
    <p>
      This reads the to dos and bookmarks saved under the old extension ID
      (<code>newtabber@local</code>), so they can be restored into the signed add-on.
    </p>
    <p id="summary">Reading…</p>
    <p>
      <button id="download" hidden>Save backup file</button>
    </p>
    <details hidden id="raw-wrap">
      <summary>Show the raw JSON</summary>
      <textarea id="raw" readonly></textarea>
    </details>
    <script src="export.js"></script>
  </body>
</html>
